<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300" role="img" aria-labelledby="title desc">
  <title id="title">PitchMind logo</title>
  <desc id="desc">PitchMind football intelligence logo with a pitch-shaped data mark and wordmark.</desc>
  <defs>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="0.58" stop-color="#0d1f2d"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="markGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13d8a3"/>
      <stop offset="0.46" stop-color="#20b7ff"/>
      <stop offset="1" stop-color="#f6c85f"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#13d8a3" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#20b7ff" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
