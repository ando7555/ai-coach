    <path d="M35 70h78" fill="none" stroke="url(#lineGrad)" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="74" cy="70" r="26" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-opacity="0.28"/>
