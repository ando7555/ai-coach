<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PitchMind football intelligence portal" />
    <title>PitchMind Intelligence Portal</title>
    <script>
      if (typeof navigator === 'undefined') {
        var navigator = {
          connection: { downlink: 5 },
          userAgent: ''
        };
      }

      (function () {
        var root =
          typeof globalThis !== 'undefined' ? globalThis : typeof window !== 'undefined' ? window : undefined;

        if (!root || typeof root.navigator !== 'undefined') {
          return;
        }

        try {
          Object.defineProperty(root, 'navigator', {
            configurable: true,
            value: navigator
          });
        } catch (error) {
          root.navigator = navigator;
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <main class="startup-fallback">
        <section>
          <h1>PitchMind Intelligence Portal</h1>
          <p>Loading the application shell. If this message stays visible, refresh the page or open the app in a current Chrome, Edge, Firefox, or Safari browser.</p>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
