<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PitchMind football intelligence portal" />
    <title>PitchMind Intelligence Portal</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var root =
          typeof globalThis !== 'undefined' ? globalThis : typeof window !== 'undefined' ? window : undefined;

        if (!root || typeof root.navigator !== 'undefined') {
          return;
        }

        try {
          Object.defineProperty(root, 'navigator', {
            configurable: true,
            value: {
              connection: { downlink: 5 },
              userAgent: ''
            }
          });
        } catch (error) {
          root.navigator = {
            connection: { downlink: 5 },
            userAgent: ''
          };
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
